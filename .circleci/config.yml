version: 2.1

# Mutation testing runs here; the remaining quality and security jobs stay in
# GitHub Actions (.github/workflows/quality.yml).
#
# Branch builds always mutate the whole set of changes on the branch, i.e. the
# diff against the merge-base with the base branch, not just the last commit.
# Add `mutation-changed` to GitHub branch protection as a required check.

jobs:
  mutation-changed:
    docker:
      - image: cimg/node:22
    resource_class: medium
    steps:
      # Full clone: git merge-base needs the commit graph.
      - checkout
      # Cache keys use only the documented templates. There is no
      # {{ .Checksum }}; the checksum template is {{ checksum "file" }}.
      - restore_cache:
          keys:
            - pi-mono-npm-v1-{{ checksum "package-lock.json" }}
            - pi-mono-npm-v1-
      # Caches are immutable per key, so the incremental key changes every
      # run and the prefix key is the fallback that finds the latest one.
      - restore_cache:
          keys:
            - pi-mono-stryker-v1-<< pipeline.git.branch >>-{{ .Revision }}
            - pi-mono-stryker-v1-<< pipeline.git.branch >>-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: pi-mono-npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
            - ~/.npm
      - run:
          name: Mutate all changes on the branch
          no_output_timeout: 30m
          command: |
            base_ref="<< pipeline.event.github.pull_request.base.ref >>"
            if [ -z "$base_ref" ]; then
              base_ref="master"
            fi
            git fetch --no-tags origin "$base_ref"
            base="$(git merge-base FETCH_HEAD HEAD)" \
              || base="$(git merge-base "origin/$base_ref" HEAD)" \
              || base="$base_ref"
            # A push to the base branch has itself as its merge-base, so
            # there is nothing to mutate. Use the pushed commit's parent.
            if [ "$base" = "$CIRCLE_SHA1" ]; then
              base="$(git rev-parse 'HEAD^' 2>/dev/null)" || base="$base"
            fi
            echo "Mutating branch changes against $base"
            node scripts/mutation-changed.mjs "$base"
      - run:
          name: Publish mutation reports
          when: always
          command: |
            mkdir -p /tmp/artifacts
            if [ -d reports/mutation ]; then
              cp -r reports/mutation /tmp/artifacts/
            fi
      - store_artifacts:
          path: /tmp/artifacts
      - save_cache:
          key: pi-mono-stryker-v1-<< pipeline.git.branch >>-{{ .Revision }}
          paths:
            - reports/mutation/stryker-incremental.json

workflows:
  quality:
    jobs:
      - mutation-changed
